# SpecForge Production Environment Configuration
#
# This docker-compose file is designed for production deployment
# with proper resource limits, health checks, and security settings.

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: specforge
      POSTGRES_USER: ${DB_USER:-specforge}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-specforge}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: specforge:${APP_VERSION:-latest}
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER:-specforge}:${DB_PASSWORD}@postgres:5432/specforge
      SECRET_KEY: ${SECRET_KEY}
      TOKEN_ENCRYPTION_SECRET: ${TOKEN_ENCRYPTION_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_VERSION: ${APP_VERSION}
      # Production feature flags (controlled via env)
      AI_ENHANCEMENT_ENABLED: ${AI_ENHANCEMENT_ENABLED:-true}
      EXPORT_SHARING_ENABLED: ${EXPORT_SHARING_ENABLED:-true}
      ANALYTICS_ENABLED: ${ANALYTICS_ENABLED:-true}
      QUOTA_ENFORCEMENT: ${QUOTA_ENFORCEMENT:-strict}
      # Production rate limits
      RATE_LIMIT_ANALYZE: ${RATE_LIMIT_ANALYZE:-20}
      RATE_LIMIT_AI_CHAT: ${RATE_LIMIT_AI_CHAT:-10}
      RATE_LIMIT_AI_ENHANCE: ${RATE_LIMIT_AI_ENHANCE:-10}
      RATE_LIMIT_EXPORT_CREATE: ${RATE_LIMIT_EXPORT_CREATE:-30}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-}
      JOB_STALE_MINUTES: ${JOB_STALE_MINUTES:-15}
      JOB_STALE_CHECK_INTERVAL_SECONDS: ${JOB_STALE_CHECK_INTERVAL_SECONDS:-300}
    ports:
      - "127.0.0.1:5000:5000"  # Bind to localhost; use reverse proxy for TLS
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
      replicas: ${WEB_REPLICAS:-2}
    networks:
      - internal
      - public

  worker:
    image: specforge:${APP_VERSION:-latest}
    command: python -m specforge.worker
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER:-specforge}:${DB_PASSWORD}@postgres:5432/specforge
      SECRET_KEY: ${SECRET_KEY}
      TOKEN_ENCRYPTION_SECRET: ${TOKEN_ENCRYPTION_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-}
      JOB_STALE_MINUTES: ${JOB_STALE_MINUTES:-15}
      JOB_STALE_CHECK_INTERVAL_SECONDS: ${JOB_STALE_CHECK_INTERVAL_SECONDS:-300}
      QUOTA_ENFORCEMENT: ${QUOTA_ENFORCEMENT:-strict}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
      replicas: ${WORKER_REPLICAS:-1}
    networks:
      - internal

volumes:
  pgdata:
  backups:

networks:
  internal:
    driver: bridge
  public:
    driver: bridge
