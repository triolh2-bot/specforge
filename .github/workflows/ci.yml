name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run syntax gate
        run: python -m compileall app.py specforge tests

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run test suite
        run: python -m unittest discover -s tests -q

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build -t specforge:${{ github.sha }} .

      - name: Export image artifact
        run: docker save specforge:${{ github.sha }} | gzip > specforge-image.tar.gz

      - name: Upload container artifact
        uses: actions/upload-artifact@v4
        with:
          name: specforge-image-${{ github.sha }}
          path: specforge-image.tar.gz
          retention-days: 7
