services:
  web:
    build: .
    command: gunicorn --bind 0.0.0.0:5000 --workers 2 --threads 4 --timeout 120 app:app
    environment:
      DATABASE_URL: postgresql+psycopg://specforge:specforge@db:5432/specforge
      PORT: "5000"
      SECRET_KEY: ${SECRET_KEY:-change-me}
      TOKEN_ENCRYPTION_SECRET: ${TOKEN_ENCRYPTION_SECRET:-change-me-too}
      MINIMAX_CLIENT_ID: ${MINIMAX_CLIENT_ID:-}
      MINIMAX_CLIENT_SECRET: ${MINIMAX_CLIENT_SECRET:-}
      MINIMAX_REDIRECT_URI: ${MINIMAX_REDIRECT_URI:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_GROUP_ID: ${MINIMAX_GROUP_ID:-}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: python -m specforge.worker
    environment:
      DATABASE_URL: postgresql+psycopg://specforge:specforge@db:5432/specforge
      PORT: "5000"
      SECRET_KEY: ${SECRET_KEY:-change-me}
      TOKEN_ENCRYPTION_SECRET: ${TOKEN_ENCRYPTION_SECRET:-change-me-too}
      MINIMAX_CLIENT_ID: ${MINIMAX_CLIENT_ID:-}
      MINIMAX_CLIENT_SECRET: ${MINIMAX_CLIENT_SECRET:-}
      MINIMAX_REDIRECT_URI: ${MINIMAX_REDIRECT_URI:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_GROUP_ID: ${MINIMAX_GROUP_ID:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: specforge
      POSTGRES_USER: specforge
      POSTGRES_PASSWORD: specforge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specforge -d specforge"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - specforge-db:/var/lib/postgresql/data

volumes:
  specforge-db:
