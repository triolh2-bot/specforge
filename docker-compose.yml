services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: specforge
      POSTGRES_USER: specforge
      POSTGRES_PASSWORD: specforge
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specforge -d specforge"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
    command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "2", "--threads", "4", "app:app"]
    environment:
      PORT: "${PORT:-5000}"
      APP_VERSION: "${APP_VERSION:-2.1.0}"
      DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg://specforge:specforge@postgres:5432/specforge}"
      SECRET_KEY: "${SECRET_KEY:-change-me}"
      TOKEN_ENCRYPTION_SECRET: "${TOKEN_ENCRYPTION_SECRET:-change-me-too}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-true}"
      SESSION_COOKIE_SAMESITE: "${SESSION_COOKIE_SAMESITE:-Lax}"
      MINIMAX_CLIENT_ID: "${MINIMAX_CLIENT_ID:-}"
      MINIMAX_CLIENT_SECRET: "${MINIMAX_CLIENT_SECRET:-}"
      MINIMAX_REDIRECT_URI: "${MINIMAX_REDIRECT_URI:-}"
      MINIMAX_API_KEY: "${MINIMAX_API_KEY:-}"
      MINIMAX_GROUP_ID: "${MINIMAX_GROUP_ID:-}"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
    command: ["python", "-m", "specforge.worker"]
    environment:
      APP_VERSION: "${APP_VERSION:-2.1.0}"
      DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg://specforge:specforge@postgres:5432/specforge}"
      SECRET_KEY: "${SECRET_KEY:-change-me}"
      TOKEN_ENCRYPTION_SECRET: "${TOKEN_ENCRYPTION_SECRET:-change-me-too}"
      MINIMAX_CLIENT_ID: "${MINIMAX_CLIENT_ID:-}"
      MINIMAX_CLIENT_SECRET: "${MINIMAX_CLIENT_SECRET:-}"
      MINIMAX_REDIRECT_URI: "${MINIMAX_REDIRECT_URI:-}"
      MINIMAX_API_KEY: "${MINIMAX_API_KEY:-}"
      MINIMAX_GROUP_ID: "${MINIMAX_GROUP_ID:-}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
